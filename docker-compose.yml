services:
  activepieces:
    image: activepieces/activepieces:latest
    container_name: activepieces
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - AP_DB_TYPE=PGLITE
      - AP_REDIS_TYPE=MEMORY
      - AP_FRONTEND_URL=${AP_FRONTEND_URL:-http://localhost:8080}
      - AP_WORKER_TOKEN=${AP_WORKER_TOKEN}
    volumes:
      - activepieces_data:/root/.activepieces

volumes:
  activepieces_data:
